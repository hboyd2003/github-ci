name: "Setup Java Environment"
description: "Set up the build environment for a Java Gradle project"

inputs:
  runtime_version:
    description: "The default Java runtime version to run builds on"
    required: true

runs:
  using: "composite"
  steps:
    - name: "Checkout"
      uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      with:
        fetch-depth: 0
        submodules: true
    - name: "Setup JDK ${{ inputs.runtime_version }}"
      uses: "actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880" # v6.3.0
      with:
        distribution: "zulu"
        java-version: "${{ inputs.runtime_version }}"
    - name: "Exclude Dependency Graph from Git" # Fixes Git cleanliness checks
      run: |
        mkdir -p .git/info
        echo "/dependency-graph-reports/" > .git/info/exclude
      shell: bash
    - name: "Setup Gradle"
      uses: "gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c" # v6.4.1
      with:
        dependency-graph: "generate-and-upload"
    - name: "Allow Gradle to be executed"
      run: "chmod +x ./gradlew"
      shell: bash