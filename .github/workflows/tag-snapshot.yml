name: Tag Snapshot
on:
  workflow_call:
    inputs:
      tag-name:
        type: string
        default: snapshot
        description: The name of the tag to use

concurrency:
  cancel-in-progress: true
  group: tag-snapshot

jobs:
  tag-snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push tags
    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: "Configure Git"
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        shell: bash

      - name: "Tag Snapshot"
        run: |
          if [[ -n "$(git tag -l '${{ inputs.tag-name }}')" ]]; then
              git tag -d ${{ inputs.tag-name }}
              git push origin --delete ${{ inputs.tag-name }}
          fi

          git tag ${{ inputs.tag-name }}
          git push origin refs/tags/${{ inputs.tag-name }} --force
